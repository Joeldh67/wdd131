<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album | WDD 131</title>
    <meta name="description" content="Temple Album assignment for WDD 131 showcasing responsive design and JavaScript navigation.">
    <meta name="author" content="Joel Haro Rodriguez">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- CSS (Mobile-first, and then larger screens) -->
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <!-- JavaScript -->
    <script src="/scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <div class="header-content">
            <span class="site-title">Temple Album</span>
            <button id="menu-button" aria-label="Toggle Menu"></button>
        </div>
        <nav id="primary-nav">
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>
        <h1>Home</h1>
        <div class="temple-grid">
            <figure>
                <img src="/images/arequipa_peru_temple.webp" alt="Arequipa Peru Temple" loading="lazy" width="400" height="250">
                <figcaption>Arequipa, Peru</figcaption>
            </figure>
            <figure>
                <img src="/images/trujillo_peru_temple.webp" alt="Trujillo Peru Temple" loading="lazy" width="400" height="250">
                <figcaption>Trujillo, Peru</figcaption>
            </figure>
            <figure>
                <img src="/images/lima_peru_temple.webp" alt="Lima Peru Temple" loading="lazy" width="400" height="250">
                <figcaption>Lima, Peru</figcaption>
            </figure>
            <figure>
                <img src="/images/guayaquil_ecuador_temple.webp" alt="Guayaquil Ecuador Temple" loading="lazy" width="400" height="250">
                <figcaption>Guayaquil, Ecuador</figcaption>
            </figure>
            <figure>
                <img src="/images/quito_ecuador_temple.webp" alt="Quito Ecuador Temple" loading="lazy" width="400" height="250">
                <figcaption>Quito, Ecuador</figcaption>
            </figure>
            <figure>
                <img src="/images/bogota_colombia_temple.webp" alt="Bogotá Colombia Temple" loading="lazy" width="400" height="250">
                <figcaption>Bogotá, Colombia</figcaption>
            </figure>
            <figure>
                <img src="/images/barranquilla_temple.webp" alt="Barranquilla Colombia Temple" loading="lazy" width="400" height="250">
                <figcaption>Barranquilla, Colombia</figcaption>
            </figure>
            <figure>
                <img src="/images/la_paz_bolivia_temple.webp" alt="La Paz Bolivia Temple" loading="lazy" width="400" height="250">
                <figcaption>La paz, Bolivia</figcaption>
            </figure>
            <figure>
                <img src="/images/cochabamba_bolivia_temple.webp" alt="Cochabamba Bolivia Temple" loading="lazy" width="400" height="250">
                <figcaption>Cochabamba, Bolivia</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> 🌲 Joel Haro Rodriguez 🌲 Perú</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
